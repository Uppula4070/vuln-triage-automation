[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vulntriage"
version = "0.1.0"
description = "Merge, de-duplicate and risk-rank findings from Semgrep, ZAP, Nuclei and pip-audit using CVSS, EPSS and CISA KEV."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Vaishnavi U" }]
dependencies = []  # standard library only

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.17.3"]

[project.scripts]
vulntriage = "vulntriage.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
